name: SALIMO. - Security and functional checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salimo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: salimo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salimo -d salimo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://salimo:test-only-password@localhost:5432/salimo_test?schema=public
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-test-password
      SYNC_API_TOKEN: ci-sync-token
      CRON_SECRET: ci-cron-token
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:security
      - run: node --test tests/map-assets.test.mjs tests/venue-coordinates.test.mjs
      - run: npm run build
      - run: npx prisma migrate deploy
      - name: Test public pages and admin with isolated PostgreSQL
        run: |
          npm run start > /tmp/salimo-next.log 2>&1 &
          for attempt in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin || true)
            if [ "$status" = "401" ]; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)" = "401"
          npm run test:e2e
